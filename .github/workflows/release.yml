name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: check_tag
        run: |
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERSION: ${{ steps.pkg.outputs.version }}

      - name: Package extension (.vsix)
        if: steps.check_tag.outputs.exists == 'false'
        run: npx vsce package --no-dependencies -o "local-slms-${VERSION}.vsix"
        env:
          VERSION: ${{ steps.pkg.outputs.version }}

      - name: Create GitHub release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          gh release create "v${VERSION}" "local-slms-${VERSION}.vsix" \
            --title "v${VERSION}" \
            --generate-notes

      - name: Skip notice
        if: steps.check_tag.outputs.exists == 'true'
        run: echo "::notice::v${{ steps.pkg.outputs.version }} was already released; bump the version in package.json to publish a new one."
